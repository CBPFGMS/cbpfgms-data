name: API Benchmark

on:
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * *"

concurrency:
    group: data-repo-push
    cancel-in-progress: false

jobs:
    benchmark:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: node dist/main.js
              working-directory: utils/apibench
            - run: |
                  git config --global user.name 'GitHub Action'
                  git config --global user.email 'action@github.com'
                  git add data/
                  git diff --staged --quiet && exit 0

                  LAST_COMMITTER=$(git log -1 --pretty=format:'%ae')
                  if [ "$LAST_COMMITTER" = "action@github.com" ]; then
                    git commit --amend --no-edit
                    git push --force-with-lease
                  else
                    git commit -m "Update data"
                    git push
                  fi
              working-directory: utils/apibench

            - name: Check for errors and Create Summary
              id: error_check
              working-directory: utils/apibench
              run: |
                  if [ -f "data/errors.json" ]; then
                    echo "### ⚠️ API Benchmark Errors Detected" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "**Error Details:**" >> $GITHUB_STEP_SUMMARY
                    echo '```json' >> $GITHUB_STEP_SUMMARY
                    cat data/errors.json >> $GITHUB_STEP_SUMMARY
                    echo '```' >> $GITHUB_STEP_SUMMARY
                    exit 1
                  fi

            - name: Upload Error Log
              if: always() && steps.error_check.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                  name: api-error-log
                  path: utils/apibench/data/errors.json
